<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#FF6B9D">
    <title>לומדים לקרוא! | Learn to Read Hebrew</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- ══════════════════ HOME ══════════════════ -->
    <div id="screen-home" class="screen active">
        <div class="home-container">
            <div class="home-logo">📖</div>
            <h1 class="home-title">לומדים לקרוא!</h1>
            <p class="home-subtitle">בואו נלמד לקרוא בעברית</p>

            <!-- rank & XP pill -->
            <div class="home-stats">
                <div class="home-stat-pill" id="home-rank">🐣 מַתְחִיל</div>
                <div class="home-stat-pill xp-pill" id="home-xp">0 XP</div>
            </div>

            <button class="btn btn-large btn-primary" onclick="app.navigateTo('levels')">
                <span class="btn-icon">🚀</span><span>בואו נתחיל!</span>
            </button>

            <div class="home-decoration">
                <span>⭐</span><span>🌟</span><span>✨</span><span>🌈</span><span>🎈</span>
            </div>
        </div>
    </div>

    <!-- ══════════════════ LEVELS ══════════════════ -->
    <div id="screen-levels" class="screen">
        <header class="app-header">
            <button class="btn-back" onclick="app.navigateTo('home')">→</button>
            <h2>בחרו שלב</h2>
            <div class="header-right">
                <div class="stars-display">
                    <span class="star-icon">⭐</span>
                    <span id="total-stars">0</span>
                </div>
                <div class="xp-display">
                    <span id="total-xp">0 XP</span>
                </div>
                <div class="rank-pill" id="rank-display">🐣 מַתְחִיל</div>
            </div>
        </header>
        <div class="levels-container" id="levels-container"></div>
    </div>

    <!-- ══════════════════ LEARN ══════════════════ -->
    <div id="screen-learn" class="screen">
        <header class="app-header">
            <button class="btn-back" onclick="app.navigateTo('levels')">→</button>
            <h2 id="learn-title"></h2>
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
        </header>
        <div class="learn-container" id="learn-container"></div>
    </div>

    <!-- ══════════════════ PRACTICE ══════════════════ -->
    <div id="screen-practice" class="screen">
        <header class="app-header">
            <button class="btn-back" onclick="app.navigateTo('levels')">→</button>
            <h2 id="practice-title"></h2>
            <div class="practice-hud">
                <span class="hud-score">
                    <span id="practice-correct">0</span>/<span id="practice-total">0</span> ⭐
                </span>
                <span class="hud-xp" id="practice-xp">+0 XP</span>
                <span class="combo-display" id="practice-combo" style="display:none"></span>
            </div>
        </header>
        <div class="practice-container" id="practice-container"></div>
    </div>

    <!-- ══════════════════ CELEBRATE ══════════════════ -->
    <div id="screen-celebrate" class="screen">
        <div class="celebrate-container">
            <div class="celebrate-stars" id="celebrate-stars"></div>
            <h1 class="celebrate-title">כל הכבוד! 🎉</h1>
            <p class="celebrate-subtitle" id="celebrate-message"></p>
            <div class="celebrate-score" id="celebrate-score"></div>
            <div class="celebrate-xp"   id="celebrate-xp"></div>
            <div class="celebrate-rank" id="celebrate-rank"></div>
            <div class="celebrate-streak" id="celebrate-streak"></div>
            <div class="celebrate-buttons">
                <button class="btn btn-large btn-secondary" onclick="app.replayLevel()">
                    <span class="btn-icon">🔄</span><span>שוב!</span>
                </button>
                <button class="btn btn-large btn-primary" onclick="app.navigateTo('levels')">
                    <span class="btn-icon">📚</span><span>שלבים</span>
                </button>
            </div>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="audio.js"></script>
    <script src="app.js"></script>
</body>
</html>
